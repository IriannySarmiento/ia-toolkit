<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Cómo llega tu agente a internet</title>
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="flecha-naranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f38020"/>
    </marker>
    <marker id="flecha-negra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="flecha-violeta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="600" rx="24" fill="#ffffff"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#1f2328">Cómo llega tu agente a internet</text>
  <text x="40" y="88" font-size="17" fill="#57606a">Nadie instala nada: GitHub guarda el código, Cloudflare y Vercel lo publican solos cada vez que cambia.</text>

  <!-- Repositorio maestro -->
  <g filter="url(#sombra)">
    <rect x="40" y="230" width="220" height="150" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  </g>
  <text x="60" y="262" font-size="13" font-weight="700" fill="#8250df" letter-spacing="1">REPOSITORIO MAESTRO</text>
  <text x="60" y="292" font-size="19" font-weight="700" fill="#1f2328">sil7en/ia-toolkit</text>
  <text x="60" y="320" font-size="15" fill="#57606a">El original del curso.</text>
  <text x="60" y="342" font-size="15" fill="#57606a">Lo actualiza el profesor.</text>

  <!-- Flecha fork -->
  <line x1="268" y1="290" x2="330" y2="290" stroke="#8250df" stroke-width="3" marker-end="url(#flecha-violeta)"/>
  <text x="299" y="276" font-size="14" font-weight="700" fill="#8250df" text-anchor="middle">Fork</text>
  <text x="299" y="314" font-size="12" fill="#8250df" text-anchor="middle">una vez</text>
  <!-- Sync fork -->
  <path d="M 150 384 C 150 470, 390 470, 390 400" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#flecha-violeta)"/>
  <text x="250" y="488" font-size="14" fill="#8250df" text-anchor="middle">Sync fork: trae lo nuevo del maestro (clases 8, 9 y 10)</text>

  <!-- Tu fork -->
  <g filter="url(#sombra)">
    <rect x="340" y="200" width="260" height="196" rx="16" fill="#ffffff" stroke="#8250df" stroke-width="2.5"/>
  </g>
  <text x="362" y="232" font-size="13" font-weight="700" fill="#8250df" letter-spacing="1">TU FORK (TU COPIA)</text>
  <text x="362" y="262" font-size="19" font-weight="700" fill="#1f2328">tu-usuario/ia-toolkit</text>
  <rect x="362" y="280" width="104" height="34" rx="8" fill="#fff4e8" stroke="#f38020"/>
  <text x="414" y="302" font-size="15" font-weight="600" fill="#b35400" text-anchor="middle">backend/</text>
  <rect x="476" y="280" width="104" height="34" rx="8" fill="#f2f2f2" stroke="#1f2328"/>
  <text x="528" y="302" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">frontend/</text>
  <text x="362" y="342" font-size="15" fill="#57606a">Aquí editas: objetivo.md,</text>
  <text x="362" y="364" font-size="15" fill="#57606a">marca.ts, herramientas…</text>

  <!-- Commit loop -->
  <rect x="460" y="500" width="180" height="40" rx="20" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="550" y="526" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">✎ Commit en main</text>
  <line x1="550" y1="498" x2="550" y2="402" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="550" y="564" font-size="14" fill="#1a7f37" text-anchor="middle">cada cambio se vuelve a publicar solo</text>

  <!-- Hacia Cloudflare -->
  <path d="M 602 260 C 640 260, 640 175, 682 175" fill="none" stroke="#f38020" stroke-width="3" marker-end="url(#flecha-naranja)"/>
  <text x="640" y="196" font-size="13" fill="#b35400" text-anchor="end">backend/</text>
  <!-- Hacia Vercel -->
  <path d="M 602 340 C 640 340, 640 425, 682 425" fill="none" stroke="#1f2328" stroke-width="3" marker-end="url(#flecha-negra)"/>
  <text x="640" y="418" font-size="13" fill="#1f2328" text-anchor="end">frontend/</text>

  <!-- Cloudflare -->
  <g filter="url(#sombra)">
    <rect x="690" y="110" width="230" height="130" rx="16" fill="#fff4e8" stroke="#f38020" stroke-width="2"/>
  </g>
  <text x="710" y="142" font-size="13" font-weight="700" fill="#b35400" letter-spacing="1">CLOUDFLARE</text>
  <text x="710" y="170" font-size="19" font-weight="700" fill="#1f2328">Workers Builds</text>
  <text x="710" y="196" font-size="15" fill="#57606a">instala, revisa y</text>
  <text x="710" y="216" font-size="15" fill="#57606a">publica el agente</text>

  <!-- Vercel -->
  <g filter="url(#sombra)">
    <rect x="690" y="360" width="230" height="130" rx="16" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
  </g>
  <text x="710" y="392" font-size="13" font-weight="700" fill="#1f2328" letter-spacing="1">VERCEL</text>
  <text x="710" y="420" font-size="19" font-weight="700" fill="#1f2328">Next.js</text>
  <text x="710" y="446" font-size="15" fill="#57606a">construye y publica</text>
  <text x="710" y="466" font-size="15" fill="#57606a">la página pública</text>

  <!-- URLs -->
  <line x1="922" y1="175" x2="958" y2="175" stroke="#f38020" stroke-width="3" marker-end="url(#flecha-naranja)"/>
  <rect x="966" y="128" width="284" height="96" rx="14" fill="#ffffff" stroke="#f38020" stroke-width="2"/>
  <text x="984" y="156" font-size="13" font-weight="700" fill="#b35400" letter-spacing="1">EL AGENTE (BACKEND)</text>
  <text x="984" y="184" font-size="15" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2328">agente-ene.&lt;tu-subdominio&gt;</text>
  <text x="984" y="206" font-size="15" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2328">.workers.dev</text>

  <line x1="922" y1="425" x2="958" y2="425" stroke="#1f2328" stroke-width="3" marker-end="url(#flecha-negra)"/>
  <rect x="966" y="378" width="284" height="96" rx="14" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="984" y="406" font-size="13" font-weight="700" fill="#1f2328" letter-spacing="1">LA PÁGINA (FRONTEND)</text>
  <text x="984" y="434" font-size="15" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2328">&lt;tu-proyecto&gt;.vercel.app</text>
  <text x="984" y="456" font-size="13" fill="#57606a">la abres en el teléfono</text>

  <!-- La página le habla al agente -->
  <line x1="1108" y1="374" x2="1108" y2="232" stroke="#57606a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#flecha)"/>
  <rect x="1116" y="286" width="150" height="40" rx="8" fill="#ffffff"/>
  <text x="1122" y="302" font-size="12" fill="#57606a">le habla al agente con</text>
  <text x="1122" y="320" font-size="12" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="#1f2328">NEXT_PUBLIC_API_URL</text>
</svg>
